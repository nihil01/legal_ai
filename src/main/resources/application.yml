spring:
  application:
    name: legal-ai-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/legal_ai}
    username: ${DATABASE_USERNAME:legal_ai}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:2}
  quartz:
    auto-startup: true
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: legal-ai-quartz
      org.quartz.threadPool.threadCount: ${QUARTZ_THREAD_COUNT:2}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  thymeleaf:
    cache: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  security:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
  storage:
    path: ${DOCUMENT_STORAGE_PATH:/data/legal-ai/original-documents}
  upload:
    max-bytes: ${MAX_UPLOAD_BYTES:26214400}
  processing:
    poll-delay-ms: ${PROCESSING_POLL_DELAY_MS:2000}
    max-attempts: ${PROCESSING_MAX_ATTEMPTS:3}
    lock-timeout-seconds: ${PROCESSING_LOCK_TIMEOUT_SECONDS:600}
    max-chunk-characters: ${MAX_CHUNK_CHARACTERS:6000}
  embedding:
    provider: ${EMBEDDING_PROVIDER:local}
    dimension: 1536
    base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    connect-timeout-seconds: ${EMBEDDING_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${EMBEDDING_READ_TIMEOUT_SECONDS:60}
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    text-model: ${OPENAI_TEXT_MODEL:gpt-4.1-mini}
    transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
    connect-timeout-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${OPENAI_READ_TIMEOUT_SECONDS:120}
    max-audio-bytes: ${OPENAI_MAX_AUDIO_BYTES:10485760}
  eqanun:
    sync:
      enabled: ${EQANUN_SYNC_ENABLED:true}
      cron: ${EQANUN_SYNC_CRON:0 0 3 * * ?}
      time-zone: ${EQANUN_SYNC_TIME_ZONE:Asia/Baku}
