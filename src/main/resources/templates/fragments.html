<!doctype html>
<html lang="az" xmlns:th="http://www.thymeleaf.org">
  <body>
    <aside class="sidebar" th:fragment="sidebar(active)">
      <a class="brand" href="/admin" aria-label="Legal AI idarəetmə paneli">
        <span class="brand-mark">L</span>
        <span><strong>Legal AI</strong><small>Bilik platforması</small></span>
      </a>
      <nav class="sidebar-nav" aria-label="Əsas naviqasiya">
        <a href="/admin" th:classappend="${active == 'dashboard'} ? ' active'">
          <span class="nav-icon">⌂</span><span>İcmal</span>
        </a>
        <a href="/admin/documents" th:classappend="${active == 'documents'} ? ' active'">
          <span class="nav-icon">▤</span><span>Sənədlər</span>
        </a>
        <a href="/admin/documents/upload" th:classappend="${active == 'upload'} ? ' active'">
          <span class="nav-icon">＋</span><span>Yükləmə</span>
        </a>
        <a href="/admin/search" th:classappend="${active == 'search'} ? ' active'">
          <span class="nav-icon">⌕</span><span>Semantik axtarış</span>
        </a>
      </nav>
      <div class="sidebar-status">
        <span class="live-dot"></span>
        <div><strong>RAG emal axını</strong><small>Sistem aktivdir</small></div>
      </div>
      <div class="sidebar-footer">Spring MVC · pgvector</div>
    </aside>

    <header class="topbar" th:fragment="topbar(title, subtitle)">
      <button class="icon-button mobile-menu" type="button" data-sidebar-toggle aria-label="Menyunu aç">☰</button>
      <div class="topbar-title"><strong th:text="${title}"></strong><small th:text="${subtitle}"></small></div>
      <div class="topbar-actions">
        <a class="icon-button" href="/admin/search" aria-label="Axtarış">⌕</a>
        <span class="admin-avatar" title="İdarəçi">A</span>
        <form class="logout-form" method="post" th:action="@{/logout}"><button class="icon-button logout-button" type="submit" aria-label="Çıxış" title="Çıxış">↪</button></form>
      </div>
    </header>

    <div th:fragment="alerts">
      <div class="toast success" th:if="${message}"><span>✓</span><span th:text="${message}"></span></div>
      <div class="toast error" th:if="${error}"><span>!</span><span th:text="${error}"></span></div>
    </div>
  </body>
</html>
